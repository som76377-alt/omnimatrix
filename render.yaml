services:
  - type: web
    name: omnitrix-studio
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p .tools/node .tools/cline &&
      curl -fsSL https://nodejs.org/dist/v22.18.0/node-v22.18.0-linux-x64.tar.xz
      | tar -xJ --strip-components=1 -C .tools/node &&
      PATH="$PWD/.tools/node/bin:$PATH"
      npm install --global --prefix "$PWD/.tools/cline" cline
    startCommand: >-
      export PATH="$PWD/.tools/node/bin:$PWD/.tools/cline/bin:$PATH" &&
      python -m interfaces.web.server
      --host 0.0.0.0
      --port $PORT
      --config config/mobile.models.json
      --workspace-root .
      --allow-public-chat
      --allow-free-quota
    healthCheckPath: /api/mobile/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: OMNITRIX_PUBLIC_CHAT_ENABLED
        value: "true"
      - key: OMNITRIX_ENABLE_CLINE_API
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
