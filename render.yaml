services:
  - type: web
    name: omnitrix-studio
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/mobile/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: OMNITRIX_PUBLIC_CHAT_ENABLED
        value: "true"
      - key: OMNITRIX_ENABLE_CLINE_API
        value: "true"
      - key: CLINE_EXECUTION_BACKEND
        value: github_actions
      - key: CLINE_REMOTE_BASE_REF
        value: main
      - key: OMNITRIX_GITHUB_ACTIONS_TOKEN
        sync: false
      - key: CLINE_PROVIDER
        value: openrouter
      - key: CLINE_MODEL
        value: minimax/minimax-m3.1-flash:free
      - key: GROQ_FREE_QUOTA_CONFIRMED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
