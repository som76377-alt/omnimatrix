name: Reasoning model smoke test

on:
  push:
    branches: [main]
    paths:
      - "config/mobile.models.json"
      - "config/agents.json"
      - "core/models/providers/**"
      - "core/orchestrator/omnitrix.py"
      - "interfaces/web/server.py"
      - "benchmarks/**"
      - ".github/workflows/reasoning-smoke.yml"
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of generic benchmark prompts to send (each uses free-route quota)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: reasoning-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Call configured free Reasoning model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate benchmark and model configuration
        run: |
          python -m json.tool benchmarks/reasoning_v1.json > /dev/null
          python -m json.tool config/mobile.models.json > /dev/null
          python -m compileall -q benchmarks/run_reasoning_v1.py

      - name: Verify live Render reasoning route without exposing secrets
        env:
          HEALTH_URL: https://omnitrix-studio.onrender.com/api/mobile/health
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import urlopen

          with urlopen(os.environ["HEALTH_URL"], timeout=20) as response:
              health = json.loads(response.read().decode("utf-8"))
          print("Hosted chat available:", health.get("chat_available"))
          print("OpenRouter key visible to Render:", health.get("openrouter_key_detected"))
          print("Reasoning route available:", health.get("reasoning_specialist_available"))
          print("Reasoning route status:", health.get("reasoning_route_status"))
          print("Configured reasoning model:", health.get("preferred_reasoning_model"))
          if not health.get("openrouter_key_detected"):
              raise SystemExit("FAIL: Render's running process cannot see OPENROUTER_API_KEY.")
          if not health.get("reasoning_specialist_available"):
              raise SystemExit("FAIL: Render sees the key, but the reasoning route is not available.")
          print("PASS: Render reports the OpenRouter reasoning route as available.")
          PY

      - name: Smoke-test ordinary chat route (one live greeting)
        env:
          HEALTH_URL: https://omnitrix-studio.onrender.com/api/mobile/health
          CHAT_URL: https://omnitrix-studio.onrender.com/api/mobile/chat
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import uuid
          from urllib.request import Request, urlopen

          health_url = os.environ["HEALTH_URL"]
          chat_url = os.environ["CHAT_URL"]
          expected = os.environ["EXPECTED_REVISION"][:7]
          health = {}
          # Render deploys asynchronously after a push. Do not test stale code.
          for attempt in range(36):
              try:
                  with urlopen(health_url, timeout=8) as response:
                      health = json.loads(response.read().decode("utf-8"))
                  revision = str(health.get("revision", ""))
                  if revision.startswith(expected):
                      break
              except Exception as exc:
                  if attempt == 35:
                      raise SystemExit(f"FAIL: hosted health did not become ready ({type(exc).__name__}).")
              time.sleep(5)
          else:
              raise SystemExit(
                  f"FAIL: Render did not serve expected revision {expected}; "
                  f"last revision was {health.get('revision', 'unknown')}."
              )

          session_id = "smoke_" + uuid.uuid4().hex
          body = json.dumps({
              "session_id": session_id,
              "message": "Hello",
          }).encode("utf-8")
          request = Request(
              chat_url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=75) as response:
              result = json.loads(response.read().decode("utf-8"))

          trace = result.get("execution_trace") or {}
          activities = trace.get("activity") or []
          answer = next(
              (item for item in reversed(activities)
               if item.get("stage") == "answer_generation"),
              activities[-1] if activities else {},
          )
          print("Deployed revision:", health.get("revision"))
          print("Greeting answer provider:", answer.get("provider", "unknown"))
          print("Greeting answer model:", answer.get("model", answer.get("configured_model", "unknown")))
          for fallback in trace.get("provider_fallbacks") or []:
              print(
                  "Fallback diagnostic:",
                  fallback.get("from_provider", "unknown"),
                  fallback.get("from_model", "unknown"),
                  "->",
                  fallback.get("to_provider", "unknown"),
                  fallback.get("to_model", "unknown"),
                  "reason=" + str(fallback.get("reason_code", "unknown")),
                  "exception=" + str(fallback.get("exception_type", "unknown")),
              )
          if answer.get("provider") == "google":
              print("PASS: ordinary greeting used the configured Gemini route.")
          else:
              fallbacks = trace.get("provider_fallbacks") or []
              reason = str(fallbacks[-1].get("reason_code", "")) if fallbacks else ""
              if reason.startswith("http_429_"):
                  print(
                      "WARN: Gemini returned HTTP 429 (rate/quota limit). "
                      "The configured route was attempted and Omnitrix returned "
                      "a fallback answer; this run cannot verify Gemini availability."
                  )
              else:
                  raise SystemExit(
                      "FAIL: ordinary greeting fell back for a non-rate-limit reason. "
                      "See the safe fallback diagnostic above."
                  )
          PY

      - name: Run live smoke benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CASE_LIMIT: ${{ inputs.case_limit || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "Missing repository Actions secret OPENROUTER_API_KEY."
            exit 1
          fi
          python benchmarks/run_reasoning_v1.py \
            --limit "$CASE_LIMIT" \
            --output "$RUNNER_TEMP/reasoning-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/reasoning-report.json").read_text(encoding="utf-8"))
          assert report["provider"] == "openrouter", report.get("provider")
          assert report["case_count"] >= 1, report.get("case_count")
          assert all(isinstance(item.get("response"), str) and item["response"].strip() for item in report["results"])
          assert all(item.get("provider_reported") == "openrouter" for item in report["results"])
          print(f"PASS: {report['case_count']} live response(s) received from the OpenRouter Reasoning route.")
          print(f"Configured model: {report['configured_model']}")
          for item in report["results"]:
              total = len(item["review_signals_found"]) + len(item["review_signals_missing"])
              print(f"- {item['case_id']}: {item['latency_seconds']}s; review signals found {len(item['review_signals_found'])}/{total}")
          PY
