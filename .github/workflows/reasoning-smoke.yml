name: Reasoning model smoke test

on:
  push:
    branches: [main]
    paths:
      - "config/mobile.models.json"
      - "config/agents.json"
      - "core/models/providers/**"
      - "core/orchestrator/omnitrix.py"
      - "interfaces/web/server.py"
      - "benchmarks/**"
      - ".github/workflows/reasoning-smoke.yml"
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of generic benchmark prompts to send (each uses free-route quota)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: reasoning-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Call configured free Reasoning model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate benchmark and model configuration
        run: |
          python -m json.tool benchmarks/reasoning_v1.json > /dev/null
          python -m json.tool config/mobile.models.json > /dev/null
          python -m compileall -q benchmarks/run_reasoning_v1.py

      - name: Verify live Render reasoning route without exposing secrets
        env:
          HEALTH_URL: https://omnitrix-studio.onrender.com/api/mobile/health
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import urlopen

          with urlopen(os.environ["HEALTH_URL"], timeout=20) as response:
              health = json.loads(response.read().decode("utf-8"))
          print("Hosted chat available:", health.get("chat_available"))
          print("OpenRouter key visible to Render:", health.get("openrouter_key_detected"))
          print("Reasoning route available:", health.get("reasoning_specialist_available"))
          print("Reasoning route status:", health.get("reasoning_route_status"))
          print("Configured reasoning model:", health.get("preferred_reasoning_model"))
          if not health.get("openrouter_key_detected"):
              raise SystemExit("FAIL: Render's running process cannot see OPENROUTER_API_KEY.")
          if not health.get("reasoning_specialist_available"):
              raise SystemExit("FAIL: Render sees the key, but the reasoning route is not available.")
          print("PASS: Render reports the OpenRouter reasoning route as available.")
          PY

      - name: Run live smoke benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CASE_LIMIT: ${{ inputs.case_limit || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "Missing repository Actions secret OPENROUTER_API_KEY."
            exit 1
          fi
          python benchmarks/run_reasoning_v1.py \
            --limit "$CASE_LIMIT" \
            --output "$RUNNER_TEMP/reasoning-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/reasoning-report.json").read_text(encoding="utf-8"))
          assert report["provider"] == "openrouter", report.get("provider")
          assert report["case_count"] >= 1, report.get("case_count")
          assert all(isinstance(item.get("response"), str) and item["response"].strip() for item in report["results"])
          assert all(item.get("provider_reported") == "openrouter" for item in report["results"])
          print(f"PASS: {report['case_count']} live response(s) received from the OpenRouter Reasoning route.")
          print(f"Configured model: {report['configured_model']}")
          for item in report["results"]:
              total = len(item["review_signals_found"]) + len(item["review_signals_missing"])
              print(f"- {item['case_id']}: {item['latency_seconds']}s; review signals found {len(item['review_signals_found'])}/{total}")
          PY
