name: Reasoning model smoke test

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of generic benchmark prompts to send (each uses free-route quota)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: reasoning-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Call configured free Reasoning model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate benchmark and model configuration
        run: |
          python -m json.tool benchmarks/reasoning_v1.json > /dev/null
          python -m json.tool config/mobile.models.json > /dev/null
          python -m compileall -q benchmarks/run_reasoning_v1.py

      - name: Run live smoke benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "Missing repository Actions secret OPENROUTER_API_KEY."
            exit 1
          fi
          python benchmarks/run_reasoning_v1.py \
            --limit "$CASE_LIMIT" \
            --output "$RUNNER_TEMP/reasoning-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/reasoning-report.json").read_text(encoding="utf-8"))
          assert report["provider"] == "openrouter", report.get("provider")
          assert report["case_count"] >= 1, report.get("case_count")
          assert all(isinstance(item.get("response"), str) and item["response"].strip() for item in report["results"])
          assert all(item.get("provider_reported") == "openrouter" for item in report["results"])
          print(f"PASS: {report['case_count']} live response(s) received from the OpenRouter Reasoning route.")
          print(f"Configured model: {report['configured_model']}")
          for item in report["results"]:
              total = len(item["review_signals_found"]) + len(item["review_signals_missing"])
              print(f"- {item['case_id']}: {item['latency_seconds']}s; review signals found {len(item['review_signals_found'])}/{total}")
          PY
