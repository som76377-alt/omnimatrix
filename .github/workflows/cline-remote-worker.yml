name: Omnitrix remote Cline worker
run-name: Cline remote worker ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {description: "Omnitrix correlation ID", required: true, type: string}
      task: {description: "Coding objective; never include secrets", required: true, type: string}
      context: {description: "Shared context; never include secrets", required: false, type: string}
      findings_json: {description: "JSON array of specialist findings", required: false, type: string}
      criteria_json: {description: "JSON array of acceptance criteria", required: false, type: string}
      scope_json: {description: "JSON array of target paths", required: false, type: string}
      mode: {description: "plan or implement", required: true, type: choice, options: [plan, implement]}
      base_ref: {description: "Branch to base work on", required: true, default: main, type: string}
      timeout_seconds: {description: "Cline execution limit in seconds", required: true, default: 300, type: number}
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: omnitrix-cline-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  cline:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cline and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --global cline
          cline --version
      - name: Run Cline in isolated GitHub-hosted runner
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLINE_MODEL: minimax/minimax-m3.1-flash:free
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY Actions secret is missing"; exit 1; }
          python scripts/cline_remote_worker.py
      - name: Create reviewable PR (never auto-merge)
        if: ${{ inputs.mode == 'implement' && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          changed="$(python -c "import json; print('yes' if json.load(open('cline-result.json')).get('changed_files') else 'no')")"
          passed="$(python -c "import json; print('yes' if json.load(open('cline-result.json')).get('tests_passed') else 'no')")"
          if [[ "$changed" != yes || "$passed" != yes ]]; then echo "No PR: changes absent or tests failed."; exit 0; fi
          branch="cline/omnitrix-${REQUEST_ID}"
          git config user.name "Omnitrix Cline Worker"
          git config user.email "omnitrix-cline-worker@users.noreply.github.com"
          git add -A -- . ':(exclude)cline-result.json' ':(exclude)cline.patch'
          git commit -m "Cline implementation for Omnitrix request ${REQUEST_ID}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          if pr_output="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$branch" --title "Cline implementation: ${REQUEST_ID}" --body "Automated proposal from Omnitrix remote Cline worker. Review diff and CI; this PR was not auto-merged." 2>&1)"; then
            python -c "import json; p='cline-result.json'; d=json.load(open(p)); d['pull_request_url']='${pr_output}'; d['pull_request_created_by']='github_actions_token'; open(p,'w').write(json.dumps(d, indent=2))"
          elif grep -qi "GitHub Actions is not permitted to create or approve pull requests" <<< "$pr_output"; then
            echo "WARN: repository policy blocks the built-in Actions token from opening pull requests; the Render runtime may create the review PR using its separately configured credential."
            python -c "import json; p='cline-result.json'; d=json.load(open(p)); d['pull_request_creation_deferred']=True; d['pull_request_creation_error']='Built-in GITHUB_TOKEN is not permitted to create pull requests.'; open(p,'w').write(json.dumps(d, indent=2))"
          else
            printf '%s\n' "$pr_output"
            exit 1
          fi
      - name: Upload result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cline-result-${{ inputs.request_id }}
          path: |
            cline-result.json
            cline.patch
          if-no-files-found: warn
          retention-days: 3
