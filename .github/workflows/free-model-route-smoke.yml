name: Verify all six free model routes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-model-route-smoke.yml"
      - "scripts/smoke_free_model_routes.py"
      - "config/mobile.models.json"
      - "core/models/providers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-model-route-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Minimal inference probe for six configured routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Check model configuration and smoke-test source
        run: |
          python -m json.tool config/mobile.models.json > /dev/null
          python -m compileall -q scripts/smoke_free_model_routes.py core/models/providers

      - name: Probe each configured model once without paid fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
        run: python scripts/smoke_free_model_routes.py
