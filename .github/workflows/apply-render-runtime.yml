name: Apply authenticated Cline runtime to Render

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-render-runtime.yml"
      - "scripts/render_build.sh"
      - "scripts/render_start.sh"
      - "interfaces/web/server.py"
      - "scripts/test_cline_orchestrator_integration.py"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-runtime-config
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply build/start commands and enable protected Cline route
        id: update
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "FAIL: Render API credentials are missing."
            exit 1
          fi
          body=$(jq -n \
            --arg build "bash scripts/render_build.sh" \
            --arg start "bash scripts/render_start.sh" \
            '{serviceDetails:{envSpecificDetails:{buildCommand:$build,startCommand:$start}}}')
          curl -sS --fail \
            --request PATCH \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$body" > "$RUNNER_TEMP/render-service-update.json"
          jq -e '.id == env.RENDER_SERVICE_ID' "$RUNNER_TEMP/render-service-update.json" >/dev/null
          verified=$(curl -sS --fail \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json')
          jq -e '.serviceDetails.envSpecificDetails.buildCommand == "bash scripts/render_build.sh" and .serviceDetails.envSpecificDetails.startCommand == "bash scripts/render_start.sh"' <<< "$verified" >/dev/null
          env_body='{"value":"true"}'
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_ENABLE_CLINE_API" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$env_body"
          runtime_token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$runtime_token"
          printf 'OMNITRIX_RUNTIME_TOKEN=%s\n' "$runtime_token" >> "$GITHUB_ENV"
          token_body=$(jq -n --arg value "$runtime_token" '{value: $value}')
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_RUNTIME_TOKEN" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$token_body"
          echo "Render service commands, protected Cline route, and private runtime token configured (token hidden)."

      - name: Wait for the auto-deployed revision and verify Cline CLI readiness
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_id=""
          for attempt in $(seq 1 120); do
            deployments=$(curl -sS --fail \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=10" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json')
            deploy_id=$(jq -r --arg sha "$EXPECTED_SHA" '[.[] | select(.commit.id == $sha) | .id][0] // empty' <<< "$deployments")
            if [[ -n "$deploy_id" ]]; then break; fi
            echo "Waiting for Render to create a deployment for ${EXPECTED_SHA:0:9}."
            sleep 5
          done
          if [[ -z "$deploy_id" ]]; then
            echo "FAIL: no Render deployment was found for the pushed revision."
            exit 1
          fi
          status=""
          for attempt in $(seq 1 120); do
            response=$(curl -sS --fail \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json')
            status=$(jq -r '.status // "unknown"' <<< "$response")
            echo "Render deployment status: $status"
            [[ "$status" == "live" ]] && break
            [[ "$status" == "build_failed" || "$status" == "update_failed" || "$status" == "canceled" ]] && exit 1
            sleep 5
          done
          if [[ "$status" != "live" ]]; then
            echo "FAIL: Render deployment did not become live before timeout."
            exit 1
          fi
          health=$(curl -sS --fail --retry 5 --retry-delay 3 \
            'https://omnitrix-studio.onrender.com/api/mobile/health')
          jq -e '.cline_worker_enabled == true and .cline_cli_ready == true and .cline_provider_key_detected == true' <<< "$health" >/dev/null
          echo "PASS: protected Cline worker is registered and ready to attempt."
      
      - name: Execute a real Cline task through the live hosted Omnitrix orchestrator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OMNITRIX_RUNTIME_TOKEN" ]]; then
            echo "FAIL: runtime token was not carried into the smoke-test step."
            exit 1
          fi
          http_status=$(curl -sS --max-time 300 -o "$RUNNER_TEMP/cline-live-smoke.json" -w '%{http_code}' \
            --request POST \
            --url "https://omnitrix-studio.onrender.com/api/admin/cline/smoke" \
            --header "Authorization: Bearer $OMNITRIX_RUNTIME_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{}')
          if [[ "$http_status" != "200" ]]; then
            echo "FAIL: live Cline smoke endpoint returned HTTP $http_status."
            jq '{ok, code, error, exit_code}' "$RUNNER_TEMP/cline-live-smoke.json" 2>/dev/null || true
            exit 1
          fi
          jq -e '.ok == true and .exit_code == 0 and (.persistence | contains("temporary integration workspace only"))' \
            "$RUNNER_TEMP/cline-live-smoke.json" >/dev/null
          echo "PASS: live Render Omnitrix ran Cline through the orchestration loop; the real coding task passed in a temporary workspace and did not change repository files."
