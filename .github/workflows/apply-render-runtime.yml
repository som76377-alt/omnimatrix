name: Apply authenticated Cline runtime to Render

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-render-runtime.yml"
      - "scripts/render_build.sh"
      - "scripts/render_start.sh"
      - "interfaces/web/server.py"
      - "scripts/test_cline_orchestrator_integration.py"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-runtime-config-live-smoke
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply build/start commands and configure the remote Cline worker
        id: update
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "FAIL: Render API credentials are missing."
            exit 1
          fi
          body=$(jq -n \
            --arg build "bash scripts/render_build.sh" \
            --arg start "bash scripts/render_start.sh" \
            '{serviceDetails:{envSpecificDetails:{buildCommand:$build,startCommand:$start}}}')
          curl -sS --fail \
            --request PATCH \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$body" > "$RUNNER_TEMP/render-service-update.json"
          jq -e '.id == env.RENDER_SERVICE_ID' "$RUNNER_TEMP/render-service-update.json" >/dev/null
          verified=$(curl -sS --fail \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json')
          jq -e '.serviceDetails.envSpecificDetails.buildCommand == "bash scripts/render_build.sh" and .serviceDetails.envSpecificDetails.startCommand == "bash scripts/render_start.sh"' <<< "$verified" >/dev/null
          env_body='{"value":"true"}'
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_ENABLE_CLINE_API" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$env_body"
          # CLINE_EXECUTION_BACKEND and CLINE_REMOTE_BASE_REF are managed by render.yaml.
          runtime_token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$runtime_token"
          printf 'OMNITRIX_RUNTIME_TOKEN=%s\n' "$runtime_token" >> "$GITHUB_ENV"
          token_body=$(jq -n --arg value "$runtime_token" '{value: $value}')
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_RUNTIME_TOKEN" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$token_body"
          echo "Render service commands, protected remote Cline route, and private runtime token configured (token hidden)."

      - name: Wait for healthy hosted chat with remote Cline route registered
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 120); do
            http_status=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/omnitrix-health.json" -w '%{http_code}' \
              'https://omnitrix-studio.onrender.com/api/mobile/health' || true)
            if [[ "$http_status" == "200" ]] && jq -e '.chat_available == true and .all_six_key_slots_detected == true and .configured_model_route_count >= 6 and .cline_worker_enabled == true' \
              "$RUNNER_TEMP/omnitrix-health.json" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            echo "Waiting for hosted chat health and remote Cline registration (HTTP $http_status)."
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "FAIL: hosted chat did not reach healthy state with remote Cline registered before timeout."
            jq '{chat_available, all_six_key_slots_detected, configured_model_route_count, cline_worker_enabled}' \
              "$RUNNER_TEMP/omnitrix-health.json" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: hosted chat is healthy and remote Cline is registered. Check cline_cli_ready: remote dispatch still requires OMNITRIX_GITHUB_ACTIONS_TOKEN in Render."
