name: Apply authenticated Cline runtime to Render

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-render-runtime.yml"
      - "scripts/render_build.sh"
      - "scripts/render_start.sh"
      - "interfaces/web/server.py"
      - "scripts/test_cline_orchestrator_integration.py"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-runtime-config-live-smoke
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply build/start commands and disable hosted Cline on the 512 MiB free instance
        id: update
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "FAIL: Render API credentials are missing."
            exit 1
          fi
          body=$(jq -n \
            --arg build "bash scripts/render_build.sh" \
            --arg start "bash scripts/render_start.sh" \
            '{serviceDetails:{envSpecificDetails:{buildCommand:$build,startCommand:$start}}}')
          curl -sS --fail \
            --request PATCH \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$body" > "$RUNNER_TEMP/render-service-update.json"
          jq -e '.id == env.RENDER_SERVICE_ID' "$RUNNER_TEMP/render-service-update.json" >/dev/null
          verified=$(curl -sS --fail \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json')
          jq -e '.serviceDetails.envSpecificDetails.buildCommand == "bash scripts/render_build.sh" and .serviceDetails.envSpecificDetails.startCommand == "bash scripts/render_start.sh"' <<< "$verified" >/dev/null
          env_body='{"value":"false"}'
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_ENABLE_CLINE_API" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$env_body"
          runtime_token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$runtime_token"
          printf 'OMNITRIX_RUNTIME_TOKEN=%s\n' "$runtime_token" >> "$GITHUB_ENV"
          token_body=$(jq -n --arg value "$runtime_token" '{value: $value}')
          curl -sS --fail --output /dev/null \
            --request PUT \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OMNITRIX_RUNTIME_TOKEN" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$token_body"
          echo "Render service commands, protected Cline route, and private runtime token configured (token hidden)."

      - name: Trigger Render deployment with the configured private runtime token
        id: deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sS --fail \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')
          deploy_id=$(jq -er '.id' <<< "$response")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Requested Render deployment: $deploy_id"

      - name: Wait for the requested revision and verify Cline CLI readiness
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_id="$DEPLOY_ID"
          status=""
          for attempt in $(seq 1 120); do
            response=$(curl -sS --fail \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json')
            status=$(jq -r '.status // "unknown"' <<< "$response")
            echo "Render deployment status: $status"
            [[ "$status" == "live" ]] && break
            [[ "$status" == "build_failed" || "$status" == "update_failed" || "$status" == "canceled" ]] && exit 1
            sleep 5
          done
          if [[ "$status" != "live" ]]; then
            echo "FAIL: Render deployment did not become live before timeout."
            exit 1
          fi
          actual_sha=$(jq -r '.commit.id // ""' <<< "$response")
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "FAIL: Render reported live commit ${actual_sha:0:9}; expected ${EXPECTED_SHA:0:9}."
            exit 1
          fi
          health=$(curl -sS --fail --retry 5 --retry-delay 3 --max-time 30 \
            'https://omnitrix-studio.onrender.com/api/mobile/health')
          jq -e '.chat_available == true and .all_six_key_slots_detected == true and .configured_model_route_count >= 6' <<< "$health" >/dev/null
          echo "PASS: hosted chat is healthy and all six model profiles are registered. Cline execution remains disabled on the 512 MiB free instance to prevent another out-of-memory crash."
