name: Deploy Omnitrix web console

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and package web console
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend and tests
        run: python -m compileall -q core interfaces tests

      - name: Validate model configuration
        run: |
          python -m json.tool config/demo.models.json > /dev/null
          python -m json.tool config/creative-studio-tools.json > /dev/null
          python -m json.tool config/creative-studio-agents.json > /dev/null
          python -m json.tool config/coordinated-agent-workflows.json > /dev/null
          python -m json.tool config/creative-production-contract.json > /dev/null

      - name: Validate browser JavaScript syntax
        run: node --check webapp/app.js && node --check webapp/rigged-character.js && node --check webapp/creative-studio.js && node --check webapp/sw.js

      - name: Exercise rigged-character motion and joint kinematics
        run: node --test tests/rigged-character.test.cjs

      - name: Run unit and web-console tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/omnitrix-tests.log 2>&1
          test_exit=$?
          set -e
          cat /tmp/omnitrix-tests.log
          if [ "$test_exit" -ne 0 ]; then
            exit "$test_exit"
          fi
          mkdir -p _site
          cp -R webapp/. _site/
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          log = Path("/tmp/omnitrix-tests.log").read_text(encoding="utf-8")
          match = re.search(r"Ran (\d+) tests?", log)
          if not match:
              raise SystemExit("Could not extract the unittest count; refusing to publish an unverified status snapshot.")
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          status = {
              "schema_version": 1,
              "test_status": "passed",
              "test_count": int(match.group(1)),
              "commit_sha": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "run_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "python_version": sys.version.split()[0],
          }
          Path("_site/status.json").write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          print("Published test snapshot metadata:", json.dumps(status, indent=2))
          PY

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
