name: Sync provider keys to Render and verify access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-provider-keys.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-key-sync
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify provider inference only where free-quota use is confirmed
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_FREE_QUOTA_CONFIRMED: ${{ vars.GROQ_FREE_QUOTA_CONFIRMED }}
        run: |
          set -euo pipefail
          FAILED=0
          check_key() {
            local name="$1" provider="$2" value="$3" model="$4" status body
            if [[ -z "$value" ]]; then
              echo "FAIL: $name is missing or empty in GitHub Actions secrets."
              FAILED=1
              return 0
            fi
            if [[ "$provider" == "groq" && "${GROQ_FREE_QUOTA_CONFIRMED:-false}" != "true" ]]; then
              echo "SKIP: $name is configured but Groq inference was not tested because free quota was not explicitly confirmed; no request was sent."
              return 0
            fi
            case "$provider" in
              gemini)
                body=$(jq -n --arg model "$model" '{model:$model,input:"Reply with exactly KEY_OK."}')
                endpoint='https://generativelanguage.googleapis.com/v1beta/interactions'
                header_name='x-goog-api-key'
                header_value="$value"
                ;;
              openrouter|groq)
                body=$(jq -n --arg model "$model" '{model:$model,messages:[{role:"user",content:"Reply with exactly KEY_OK."}],max_tokens:8}')
                if [[ "$provider" == "openrouter" ]]; then endpoint='https://openrouter.ai/api/v1/chat/completions'; else endpoint='https://api.groq.com/openai/v1/chat/completions'; fi
                header_name='Authorization'
                header_value="Bearer $value"
                ;;
            esac
            for attempt in 1 2 3; do
              status=$(curl -sS --max-time 45 -o /dev/null -w '%{http_code}' \
                -H "Content-Type: application/json" -H "$header_name: $header_value" \
                -d "$body" "$endpoint" || true)
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "000" && "$status" != "429" && "$status" != "500" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then break; fi
              sleep "$attempt"
            done
            if [[ "$status" != "200" ]]; then
              echo "FAIL: $name generation probe returned HTTP $status for configured provider/model after bounded transient retries. Key/model route is not confirmed for inference."
              FAILED=1
              return 0
            fi
            echo "PASS: $name completed a minimal provider inference request (response body suppressed)."
          }
          check_key GEMINI_API_KEY gemini "$GEMINI_API_KEY" "gemini-3.6-flash"
          check_key GEMINI_API_KEY_1 gemini "$GEMINI_API_KEY_1" "gemini-3.5-flash-lite"
          check_key OPENROUTER_API_KEY openrouter "$OPENROUTER_API_KEY" "minimax/minimax-m3.1-flash:free"
          check_key OPENROUTER_API_KEY_1 openrouter "$OPENROUTER_API_KEY_1" "nvidia/nemotron-3-ultra-550b-a55b:free"
          check_key GROQ_API_KEY groq "$GROQ_API_KEY" "openai/gpt-oss-120b"
          check_key GROQ_API_KEY_1 groq "$GROQ_API_KEY_1" "openai/gpt-oss-20b"
          if [[ "${GROQ_FREE_QUOTA_CONFIRMED:-false}" != "true" ]]; then
            echo "NOTE: Gemini and OpenRouter inference were tested. Groq routes remain gated until GROQ_FREE_QUOTA_CONFIRMED=true."
          fi
          if [[ "$FAILED" -ne 0 ]]; then
            echo "FAIL: one or more eligible key/model combinations did not complete inference; no environment sync or deployment was performed."
            exit 1
          fi

      - name: Sync provider keys to the existing Render service without replacing other variables
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_FREE_QUOTA_CONFIRMED: ${{ vars.GROQ_FREE_QUOTA_CONFIRMED }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "FAIL: RENDER_API_KEY or RENDER_SERVICE_ID is missing."
            exit 1
          fi
          sync_one() {
            local name="$1" value="$2" body
            body=$(jq -n --arg value "$value" '{value: $value}')
            curl -sS --fail --output /dev/null \
              --request PUT \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$name" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$body"
            echo "Synced $name to Render (value hidden)."
          }
          sync_one GEMINI_API_KEY "$GEMINI_API_KEY"
          sync_one GEMINI_API_KEY_1 "$GEMINI_API_KEY_1"
          sync_one OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          sync_one OPENROUTER_API_KEY_1 "$OPENROUTER_API_KEY_1"
          sync_one GROQ_API_KEY "$GROQ_API_KEY"
          sync_one GROQ_API_KEY_1 "$GROQ_API_KEY_1"
          sync_one GROQ_FREE_QUOTA_CONFIRMED "${GROQ_FREE_QUOTA_CONFIRMED:-false}"

      - name: Trigger Render deployment to load the updated environment
        id: deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sS --fail \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')
          deploy_id=$(jq -er '.id' <<< "$response")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render deployment requested: $deploy_id"

      - name: Wait for deployment and verify primary keys are visible to the live app
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          GROQ_FREE_QUOTA_CONFIRMED: ${{ vars.GROQ_FREE_QUOTA_CONFIRMED }}
        run: |
          set -euo pipefail
          status=""
          for attempt in $(seq 1 60); do
            response=$(curl -sS --fail \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json')
            status=$(jq -r '.status // "unknown"' <<< "$response")
            echo "Render deployment status: $status"
            [[ "$status" == "live" ]] && break
            [[ "$status" == "build_failed" || "$status" == "update_failed" || "$status" == "canceled" ]] && exit 1
            sleep 5
          done
          if [[ "$status" != "live" ]]; then
            echo "FAIL: deployment did not reach live status before timeout."
            exit 1
          fi
          health=$(curl -sS --fail --retry 5 --retry-delay 3 \
            'https://omnitrix-studio.onrender.com/api/mobile/health')
          expected_ready=4
          if [[ "${GROQ_FREE_QUOTA_CONFIRMED:-false}" == "true" ]]; then expected_ready=6; fi
          jq -e --argjson expected "$expected_ready" '.gemini_key_detected == true and .openrouter_key_detected == true and .all_six_key_slots_detected == true and .configured_model_route_count == 6 and .ready_model_route_count == $expected and ([.configured_model_routes[].model] | unique | length == 6)' \
            <<< "$health" >/dev/null
          echo "PASS: all six key slots are visible and six distinct model profiles are registered; ready inference routes=$expected_ready."
          jq -r '.configured_model_routes[] | "ROUTE: \\(.profile) | \\(.provider) | \\(.model) | \\(.status) | roles=\\(.preferred_by_roles|join(","))"' <<< "$health"
          echo "Note: key visibility and adapter readiness do not prove that inference has succeeded; provider response metadata is the execution evidence."
