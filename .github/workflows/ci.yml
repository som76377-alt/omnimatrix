name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and offline smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source and tests
        run: python -m compileall -q core interfaces tests

      - name: Validate checked-in model configuration
        run: |
          python -m json.tool config/demo.models.json > /dev/null
          python -m json.tool config/agents.json > /dev/null
          python -m json.tool config/mobile.models.openrouter-free.example.json > /dev/null
          python -m json.tool config/creative-studio-tools.json > /dev/null
          python -m json.tool config/creative-studio-agents.json > /dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test offline CLI
        shell: bash
        run: |
          set -euo pipefail
          output="$(printf 'Hello Omnitrix\n/exit\n' | python -m interfaces.cli.main --config config/demo.models.json)"
          printf '%s\n' "$output"
          grep -Fq 'OFFLINE DEMO' <<< "$output"
          grep -Fq 'Received input: Hello Omnitrix' <<< "$output"
