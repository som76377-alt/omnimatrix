name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnitrix-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test Python backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q core interfaces tests
          python -m unittest discover -s tests -v

      - name: Compile Kotlin, run JVM tests, and assemble APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
