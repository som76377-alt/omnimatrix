name: Android APK - launcher icon fix

on:
  pull_request:
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - "config/mobile.models.json"
      - "config/mobile-backend.json"
      - "render.yaml"
      - "tools/**"
      - "docs/ANDROID_AUTO_UPDATES.md"
      - "README.md"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - "config/mobile.models.json"
      - "config/mobile-backend.json"
      - "render.yaml"
      - "tools/**"
      - "docs/ANDROID_AUTO_UPDATES.md"
      - "README.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnitrix-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate hosted mobile model and deployment configuration
        run: |
          python -m json.tool config/mobile.models.json > /dev/null
          python -m json.tool config/mobile-backend.json > /dev/null
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", aliases: true); puts "Render Blueprint YAML is valid"'
          bash -n tools/setup_android_signing.sh

      - name: Test Python backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q core interfaces tests
          python -m unittest discover -s tests -v

      - name: Fetch original Omnitrix icon artwork
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --retry-all-errors --output android/app/src/main/res/drawable-nodpi/omnitrix_logo.png https://upload.wikimedia.org/wikipedia/commons/3/3d/Ben_10_Omnitrix.png
          python - <<'PY'
          import struct
          from pathlib import Path
          icon = Path("android/app/src/main/res/drawable-nodpi/omnitrix_logo.png").read_bytes()
          assert icon[:8] == bytes.fromhex("89504e470d0a1a0a"), "Downloaded icon is not a PNG"
          width, height = struct.unpack(">II", icon[16:24])
          assert (width, height) == (512, 512), f"Unexpected icon dimensions: {width}x{height}"
          print(f"Verified original Wikimedia Omnitrix artwork: {width}x{height} PNG ({len(icon)} bytes)")
          PY

      - name: Compile Kotlin, run JVM tests, and assemble APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace -PomnitrixVersionCode=${GITHUB_RUN_NUMBER}

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk Omnitrix.apk
          sha256sum Omnitrix.apk > Omnitrix.apk.sha256
          tag="omnitrix-android-build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            signing_note="Persistent Android signing is configured; in-app update checking and verified APK downloads are enabled."
          else
            signing_note="Persistent Android signing is not configured. In-app updates are disabled until the four ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository Actions secrets are set. Never commit the keystore to this public repository."
          fi
          cat > RELEASE_NOTES.md <<NOTES
          ## Omnitrix Android alpha

          This is an installable debug APK built from the source commit attached to this release.
          It is not Play-Store-signed. Chat uses the hosted Omnitrix mobile API at https://omnitrix-studio.onrender.com.

          $signing_note

          The hosted model key stays on the server. Never place provider keys in the APK or commit them to the repository.
          Render's free service may sleep when idle. The native Android installer still requires user confirmation when an update is installed.
          NOTES
          gh release create "$tag" Omnitrix.apk Omnitrix.apk.sha256 \
            --title "Omnitrix Android build ${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
