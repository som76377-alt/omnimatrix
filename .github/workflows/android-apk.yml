name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - "config/mobile.models.json"
      - "config/mobile-backend.json"
      - "render.yaml"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "interfaces/web/server.py"
      - ".devcontainer/**"
      - "tests/**"
      - "config/mobile.models.json"
      - "config/mobile-backend.json"
      - "render.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnitrix-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate hosted mobile model and deployment configuration
        run: |
          python -m json.tool config/mobile.models.json > /dev/null
          python -m json.tool config/mobile-backend.json > /dev/null
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", aliases: true); puts "Render Blueprint YAML is valid"'

      - name: Test Python backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q core interfaces tests
          python -m unittest discover -s tests -v

      - name: Compile Kotlin, run JVM tests, and assemble APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk Omnitrix.apk
          sha256sum Omnitrix.apk > Omnitrix.apk.sha256
          tag="omnitrix-android-build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          cat > RELEASE_NOTES.md <<'NOTES'
          ## Omnitrix Android alpha

          This is an installable **debug APK** built from the source commit attached to this release.
          It is not Play-Store-signed. After installing, open **Connect** in the app and pair it with
          the running Omnitrix Studio Python backend using its HTTPS Codespaces port URL and private
          runtime bearer token.

          The default model profile is an offline simulation. Real model inference requires an
          explicitly configured provider and credential. Workspace changes save to the active
          Codespaces checkout; this build does not silently commit or push edits to GitHub.

          See the repository README for setup and security notes.
          NOTES
          gh release create "$tag" Omnitrix.apk Omnitrix.apk.sha256 \
            --title "Omnitrix Android build ${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omnitrix-android-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
